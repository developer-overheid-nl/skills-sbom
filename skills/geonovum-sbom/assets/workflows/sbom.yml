# SBOM bij elke release, gemaakt met de skill geonovum-sbom.
#
# Bij het publiceren van een release controleert deze workflow eerst of
# sbom-inventory.json nog klopt met de repository: staat er een bestand van derden
# in de repo dat de inventaris niet noemt, of noemt de inventaris een bestand dat
# weg is, dan stopt hij. Anders maakt hij uit de inventaris een CycloneDX 1.7- en
# een SPDX 2.3-SBOM, met de release-tag als productversie.
# Hij valideert beide, ondertekent ze met een build-attestatie van GitHub en hangt
# ze als asset aan de release. De SBOMs worden niet gecommit: een gecommitte SBOM
# beschrijft alleen het moment van committen en raakt daarna verouderd.
#
# Maakt een andere workflow de release aan met github.token (bijvoorbeeld met
# `gh release create` of changesets/action), dan start GitHub deze workflow niet:
# een event dat met dat token is veroorzaakt, start geen andere workflows. Roep hem
# dan aan vanuit die workflow, als extra job na het aanmaken van de release:
#
#   sbom:
#     needs: release
#     if: needs.release.outputs.tag != ''
#     permissions:
#       contents: write
#       id-token: write
#       attestations: write
#     uses: ./.github/workflows/sbom.yml
#     with:
#       tag: ${{ needs.release.outputs.tag }}
#
# De job die de release maakt, moet de tag dan als output geven. Gebruik één van
# beide manieren, niet allebei, anders draait de workflow twee keer.
#
# Het controleren op nieuwe kwetsbaarheden staat los hiervan, in
# sbom-kwetsbaarheden.yml: dat moet doorlopend gebeuren, op de SBOM van de versie
# die in gebruik is, ook als er lang geen release komt.
#
# De scripts komen uit de skill-repository op een vaste commit (SKILL_REF), zodat
# een wijziging daar niet ongemerkt in deze workflow belandt. Werk SKILL_REF bij
# naar een nieuwere release van de skill als je die wilt gebruiken. De actions zijn
# om dezelfde reden vastgezet op een commit-hash; Dependabot kan ze bijwerken.
name: SBOM

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: Tag van de release waar de SBOMs aan komen te hangen
        required: true
        type: string
  workflow_dispatch:

permissions:
  contents: read

env:
  SKILL_REPO: developer-overheid-nl/skills-sbom
  SKILL_REF: __SKILL_REF__
  SKILL_DIR: .sbom-skill/skills/geonovum-sbom
  # De release-tag: uit het release-event, of meegegeven door de aanroepende
  # workflow. Leeg bij een handmatige run; dan komt er niets aan een release.
  TAG: ${{ inputs.tag || github.event.release.tag_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # De SBOM beschrijft de code van de tag, ook als de aanroepende workflow
      # op een andere commit draait.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
          persist-credentials: false

      - name: Skill ophalen
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.SKILL_REPO }}
          ref: ${{ env.SKILL_REF }}
          path: .sbom-skill
          persist-credentials: false

      # Geen dependency-cache: deze taak heeft schrijfrechten, en een cache die
      # elders is gevuld, kan hier code binnenbrengen.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      # Een verouderde inventaris levert een geldige maar onjuiste SBOM op. Deze stap
      # vergelijkt de inventaris met wat scan_repo.js in de repository vindt en
      # faalt bij verschillen. Waarschuwingen komen in de samenvatting van de run.
      - name: Inventaris tegen de repository controleren
        run: |
          set +e
          node "$SKILL_DIR/scripts/scan_repo.js" --inventory sbom-inventory.json --check > "$RUNNER_TEMP/inventaris.md"
          status=$?
          cat "$RUNNER_TEMP/inventaris.md"
          cat "$RUNNER_TEMP/inventaris.md" >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # Heeft de repository een lockfile of een manifest zonder vaste versies, bouw
      # of installeer dan hier zoals de release wordt gebouwd, en laat een tool de
      # geïnstalleerde boom lezen. Pas dan staan de versies in de SBOM die echt
      # worden geleverd. Schrijf naar het pad dat in "import" van de inventaris
      # staat, en zet "lifecycle" daar op "build". Bijvoorbeeld voor npm:
      #
      # - name: Bouwen en afhankelijkheden lezen
      #   run: |
      #     npm ci --omit=dev
      #     npx --yes @cyclonedx/cdxgen@11 -t js --required-only -o "$RUNNER_TEMP/bom.tool.cdx.json" --spec-version 1.6 .

      - name: SBOM maken
        run: |
          node "$SKILL_DIR/scripts/build_sbom.js" sbom-inventory.json --out "$RUNNER_TEMP/sbom" --strict ${TAG:+--version "$TAG"}
          cat "$RUNNER_TEMP/sbom/sbom-gaps.md" >> "$GITHUB_STEP_SUMMARY"

      - name: SBOM valideren
        run: |
          npm install --prefix "$RUNNER_TEMP/deps" --no-save --no-audit --no-fund ajv@8 ajv-formats@3
          node "$SKILL_DIR/scripts/validate_sbom.js" "$RUNNER_TEMP/sbom" --deps "$RUNNER_TEMP/deps"

      - name: Ondertekenen met een build-attestatie
        if: env.TAG != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/sbom/sbom.cdx.json
            ${{ runner.temp }}/sbom/sbom.spdx.json

      - name: Aan de release hangen
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/sbom/sbom.cdx.json" "$RUNNER_TEMP/sbom/sbom.spdx.json" --clobber --repo "$GITHUB_REPOSITORY"

      - name: Bewaren als artefact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            ${{ runner.temp }}/sbom/sbom.cdx.json
            ${{ runner.temp }}/sbom/sbom.spdx.json
            ${{ runner.temp }}/sbom/sbom-gaps.md
